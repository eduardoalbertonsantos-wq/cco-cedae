services:
  - type: web
    name: cco-supervisao-cedae
    env: node
    plan: free
    region: ohio
    buildCommand: cd backend && npm install && npm rebuild better-sqlite3
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://postgres:GjbOn7qwzEAsxKn7@db.pdfgbhbtsyjykkguznik.supabase.co:5432/postgres
    healthCheckPath: /api/v1/health
    autoDeploy: true
