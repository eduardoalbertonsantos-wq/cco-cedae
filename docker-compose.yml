version: '3.8'

services:
  cco-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cco_supervisao_cedae
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=cco_cedae_supervisao_seguranca_2026_prod
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
