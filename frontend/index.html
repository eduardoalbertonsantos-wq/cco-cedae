<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CCO Sistema</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    body { background-color: var(--cco-navy); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { background: white; padding: 2.5rem; border-radius: 0.75rem; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    .logo-area { margin-bottom: 2rem; }
    .logo-area h1 { color: var(--cco-navy); font-size: 1.5rem; margin-bottom: 0.25rem; }
    .logo-area p { color: var(--cco-gray-500); font-size: 0.875rem; letter-spacing: 0.05em; }
    .login-footer { margin-top: 2rem; font-size: 0.75rem; color: var(--cco-gray-400); letter-spacing: 0.1em; }
  </style>
  <!-- PWA & Mobile Capabilities -->
  <meta name="theme-color" content="#0a1628">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CCO Fiscalização">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" href="icons/favicon.png">
</head>
<body>
  <div class="login-card">
    <div class="logo-area">
      <h1>CCO &mdash; CENTRO DE CONTROLE OPERACIONAL</h1>
      <p>PAINEL EXECUTIVO DE FISCALIZAÇÃO</p>
    </div>
    <form id="loginForm" onsubmit="return false;">
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="email">E-mail</label>
        <input type="email" id="email" class="form-input" required placeholder="Digite seu e-mail">
      </div>
      <div class="form-group" style="text-align: left;">
        <label class="form-label" for="senha">Senha</label>
        <input type="password" id="senha" class="form-input" required placeholder="Digite sua senha">
      </div>
      <div id="loginError" style="color: var(--cco-red); font-size: 0.875rem; margin-top: 0.5rem; display: none;"></div>
      <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; padding: 0.75rem; margin-top: 1rem; font-size: 1rem;">ACESSAR SISTEMA</button>
    </form>
    <div class="login-footer">ASSESSORIA DE SEGURANÇA</div>
  </div>
  <script src="js/api.js"></script>
  <script defer src="js/auth.js"></script>
  <script src="js/pwa.js" defer></script>
</body>
</html>
